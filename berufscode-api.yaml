    GrossPremium:
      description: "\U0001F1E9\U0001F1EA Bruttoprämiensätze (BPS)\n\U0001F1EC\U0001F1E7 Gross premium rates (BPS)\n"
      type: object
      properties:
        occupationalAccidentInsurance:
          description: "\U0001F1E9\U0001F1EA Berufsunfallversicherung (BUV)\n\U0001F1EC\U0001F1E7 Occupational accident insurance (BUV)\n"
          type: number
          format: float
        nonOccupationalAccidentInsurance:
          description: "\U0001F1E9\U0001F1EA Nichtberufsunfallversicherung (NBUV)\n\U0001F1EC\U0001F1E7 Non occupational accident insurance (NBUV)\n"
          type: number
          format: float
