    OccupationCodeActive:
      description: "\U0001F1E9\U0001F1EA Gibt an, ob ein Berufscode aktiv ist oder nicht.\n\U0001F1EC\U0001F1E7 Indicates whether an occupation code is active or not.\n"
      type: boolean
    SubclassSection:
      description: "\U0001F1E9\U0001F1EA Schlüssel für den Unterklassenteil (UKT)\nUnterklassenteile sind Risikogemeinschaften mit gleichartigem Unfallrisiko.\nsiehe [Prämientarif der Suva](https://www.suva.ch/2925-25.D) und [Basissätze](https://www.suva.ch/335-24.D)\n\n\U0001F1EC\U0001F1E7 Key for subclass section (UKT)\nSubclass sections are risk communities with similar accident risks.\nSee [Prämientarif der Suva](https://www.suva.ch/2925-25.D) and [Basissätze](https://www.suva.ch/335-24.D)\n"
      type: string
    PremiumYear:
      description: "\U0001F1E9\U0001F1EA Prämienjahr (Standard: Kalenderjahr)\n\U0001F1EC\U0001F1E7 Premium year (default: calendar year)\n"
      type: integer
      minimum: 2000
      maximum: 3000
    Gender:
      description: "\U0001F1E9\U0001F1EA Geschlecht\n\U0001F1EC\U0001F1E7 Gender\n"
      type: string
      enum: [female, genderless, male]
    Language:
      description: "\U0001F1E9\U0001F1EA Sprache\n\U0001F1EC\U0001F1E7 Language\n"
      type: string
      enum: [de, fr, it, en]
    Product:
      description: "\U0001F1E9\U0001F1EA Produkt: Berufsunfallversicherung (BUV), Nichtberufsunfallversicherung (NBUV)\n\U0001F1EC\U0001F1E7 Product: Occupational accident insurance (BUV), Non occupational accident insurance (NBUV)\n"
      type: string
      enum: [buv, nbuv]
    OccupationCodeNumber:
      description: "\U0001F1E9\U0001F1EA Individueller Schlüssel zur Kennzeichnung des Berufscodes.\n\U0001F1EC\U0001F1E7 Individual key for identifying the occupation code.\n"
      maxLength: 40
      type: string
    Error:
      description: "\U0001F1E9\U0001F1EA Fehlermeldung\n\U0001F1EC\U0001F1E7 Error message\n"
      properties:
        message:
          description: "\U0001F1E9\U0001F1EA Die in englischer Sprache gelieferte Fehlermeldung. Beispiel: 'Occupation code with id '00000000-0000-0000-0000-000000000000' not found'.\n\U0001F1EC\U0001F1E7 Error message provided in English. Example: 'Occupation code with id '00000000-0000-0000-0000-000000000000' not found'.\n"
          type: string
        id:
          description: "\U0001F1E9\U0001F1EA Eindeutige ID der Fehlermeldung. Beispiel: Zwei Fehlermeldungen 'Occupation code with id '00000000-0000-0000-0000-000000000000' not found' haben unterschiedliche ID's.\n\U0001F1EC\U0001F1E7 Unique ID of the error message. Example: Two error messages 'Occupation code with id '00000000-0000-0000-0000-000000000000' not found' have different IDs.\n"
          type: string
        key:
          description: "\U0001F1E9\U0001F1EA Key der Fehlermeldung. Beispiel: Zwei Fehlermeldungen 'Occupation code with id '00000000-0000-0000-0000-000000000000' not found' haben denselben Key.\n\U0001F1EC\U0001F1E7 Key of the error message. Example: Two error messages 'Occupation code with id '00000000-0000-0000-0000-000000000000' not found' have the same key.\n"
          type: string
        args:
          description: "\U0001F1E9\U0001F1EA Argumente für die Aufbereitung einer Fehlermeldung. Zum Beispiel: '00000000-0000-0000-0000-000000000000'\n\U0001F1EC\U0001F1E7 Arguments for formatting an error message. For example: '00000000-0000-0000-0000-000000000000'\n"
          type: array
          items:
            type: string
      required:
        - message
        - id
        - key
