openapi: 3.1.0
info:
  version: 1.0.0
  title: Berufscode API
  description: "\U0001F1E9\U0001F1EA Beschreibt die gegenüber einem ERP angebotenen Schnittstellen auf Seite Suva für die Pflege der Berufscodes.\n\U0001F1EC\U0001F1E7 Describes the interfaces offered to an ERP system by Suva for maintaining occupational codes.\n"
  license:
    name: Apache License 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://apitest.suva.ch/occupation-codes
    description: Staging server
  - url: https://api.suva.ch/occupation-codes
    description: Production server
  - url: https://apitest.suva.ch/mock/occupation-codes
    description: Staging mock server
  - url: https://api.suva.ch/mock/occupation-codes
    description: Production mock server
tags:
  - name: Suva Occupation Codes
  - name: ISCO Occupation Types
  - name: Occupation Codes
  - name: Company Parts
  - name: Events
paths:
  /v1/suva-occupation-codes:
    parameters:
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    get:
      description: "\U0001F1E9\U0001F1EA Liefert alle von der Suva bereitgestellten branchenüblichen Berufscodes mit der Zuordnung zu der ISCO-Berufsart.\n\U0001F1EC\U0001F1E7 Provides all industry standard occupation codes provided by Suva, with the assignment to the ISCO type of profession.\n"
      tags:
        - Suva Occupation Codes
      security:
        - ApiKeyAuth: []
      operationId: getSuvaOccupationCodes
      responses:
        "200":
          description: "\U0001F1E9\U0001F1EA Liste von Suva-Berufscodes.\n\U0001F1EC\U0001F1E7 List of Suva occupation codes.\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuvaOccupationCode"
  /v1/isco-occupation-types:
    parameters:
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    get:
      description: "\U0001F1E9\U0001F1EA Liefert alle in der Suva unterstützen ISCO-Berufsarten.\n\U0001F1EC\U0001F1E7 Provides all ISCO occupation types supported by the Suva.\n"
      tags:
        - ISCO Occupation Types
      security:
        - ApiKeyAuth: []
      operationId: getIscoOccupationTypes
      parameters:
        - $ref: "#/components/parameters/PremiumYear"
      responses:
        "400":
          $ref: "#/components/responses/BadRequestError"
        "200":
          description: "\U0001F1E9\U0001F1EA Liste von ISCO-Berufsarten und zugeordnete Risiko-Klassen.\n\U0001F1EC\U0001F1E7 List of ISCO occupation types and associated risk classes.\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IscoOccupationType"
  /v1/company-parts:
    parameters:
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    get:
      description: "\U0001F1E9\U0001F1EA Liefert die Betriebsteil-Situation für alle Betriebsteile (ggf. auch Betriebsteile die keine Personalverleih-Tätigkeiten durchführen).\n\U0001F1EC\U0001F1E7 Provides the profiles for all company parts (possibly also company parts that do not carry out temporary work agency activities).\n"
      tags:
        - Company Parts
      security:
        - ApiKeyAuth: []
      operationId: getCompanyPartProfiles
      parameters:
        - $ref: "#/components/parameters/PremiumYear"
      responses:
        "400":
          $ref: "#/components/responses/BadRequestError"
        "200":
          description: "\U0001F1E9\U0001F1EA Liste von Betriebsteil-Situationen.\n\U0001F1EC\U0001F1E7 List of company part profiles.\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyPartProfile"
  /v1/occupation-codes:
    parameters:
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    get:
      description: "\U0001F1E9\U0001F1EA Liefert alle Berufscodes (Individuell und Suva) zu dem angemeldeten Personalverleiher.\n\U0001F1EC\U0001F1E7 Provides all occupation codes (individual and Suva) for the registered temporary work agency provider.\n"
      tags:
        - Occupation Codes
      security:
        - ApiKeyAuth: []
      operationId: getOccupationCodes
      responses:
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "200":
          description: "\U0001F1E9\U0001F1EA Liste von Berufscodes.\n\U0001F1EC\U0001F1E7 List of occupation codes.\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OccupationCode"
    put:
      description: "\U0001F1E9\U0001F1EA Einen Berufscode aus den Suva-Berufscodes hinzufügen.\n\U0001F1EC\U0001F1E7 Add an occupation code from the list of Suva occupation codes.\n"
      tags:
        - Occupation Codes
      security:
        - ApiKeyAuth: []
      operationId: activateOccupationCode
      requestBody:
        description: "\U0001F1E9\U0001F1EA Der hinzuzufügende Suva-Berufscode.\n\U0001F1EC\U0001F1E7 The Suva occupation code to be added.\n"
        required: true
        content:
          application/json:
            schema:
              title: OccupationCodeActivation
              type: object
              properties:
                suvaOccupationCodeId:
                  $ref: "#/components/schemas/SuvaOccupationCodeId"
                occupationCodeNumber1:
                  $ref: "#/components/schemas/OccupationCodeNumber"
                occupationCodeNumber2:
                  $ref: "#/components/schemas/OccupationCodeNumber"
              required:
                - suvaOccupationCodeId
      responses:
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupationCode"
    post:
      description: "\U0001F1E9\U0001F1EA Einen individuellen Berufscode einreichen.\n\U0001F1EC\U0001F1E7 Submit an individual occupation code.\n"
      tags:
        - Occupation Codes
      security:
        - ApiKeyAuth: []
      operationId: submitOccupationCode
      requestBody:
        description: "\U0001F1E9\U0001F1EA Der individuelle Berufscode inklusive führender Sprache.\n\U0001F1EC\U0001F1E7 The individual occupation code including leading language.\n"
        required: true
        content:
          application/json:
            schema:
              title: SubmitOccupationCode
              type: object
              properties:
                occupationCodeNumber1:
                  $ref: "#/components/schemas/OccupationCodeNumber"
                occupationCodeNumber2:
                  $ref: "#/components/schemas/OccupationCodeNumber"
                preferredLanguage:
                  $ref: "#/components/schemas/Language"
                descriptions:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/OccupationDescription"
              required:
                - preferredLanguage
                - descriptions
      responses:
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
        "200":
          description: Success
          content:
            application/json:
              schema:
                title: OccupationCodeSubmitted
                type: object
                properties:
                  eventId:
                    $ref: "#/components/schemas/EventId"
  /v1/occupation-codes/{occupationCodeId}:
    parameters:
      - $ref: "#/components/parameters/OccupationCodeId"
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    delete:
      description: "\U0001F1E9\U0001F1EA Der Berufscode wird bei Suva auf das aktuelle Datum deaktiviert. Eine erneute Aktivierung ist jederzeit wieder möglich.\n\U0001F1EC\U0001F1E7 The occupation code will be deactivated at Suva on the current date. Reactivation is possible at any time.\n"
      tags:
        - Occupation Codes
      security:
        - ApiKeyAuth: []
      operationId: deactivateOccupationCode
      responses:
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "204":
          description: Berufscode deaktiviert.
    put:
      description: "\U0001F1E9\U0001F1EA Einen Suva-Berufscode oder individuellen Berufscode aktualisieren.\n\U0001F1EC\U0001F1E7 Update a Suva occupation code or an individual occupation code.\n"
      tags:
        - Occupation Codes
      security:
        - ApiKeyAuth: []
      operationId: updateOccupationCode
      requestBody:
        description: "\U0001F1E9\U0001F1EA Der Suva-Berufscode oder individuelle Berufscode.\n\U0001F1EC\U0001F1E7 The Suva occupation code or the individual occupation code.\n"
        required: true
        content:
          application/json:
            schema:
              title: UpdateOccupationCode
              type: object
              properties:
                occupationCodeNumber1:
                  $ref: "#/components/schemas/OccupationCodeNumber"
                occupationCodeNumber2:
                  $ref: "#/components/schemas/OccupationCodeNumber"
              required:
                - occupationCodeNumber1
                - occupationCodeNumber2
      responses:
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "200":
          description: Berufscode aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupationCode"
  /v1/events:
    parameters:
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    get:
      description: "\U0001F1E9\U0001F1EA Abfrage aller nicht quittierten Events für die Informationen vorliegen (EventStatus == processed). \U0001F1EC\U0001F1E7 Query of all unacknowledged events where data is present (EventStatus == processed)."
      tags:
        - Events
      operationId: getEvents
      security:
        - ApiKeyAuth: []
      responses:
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "200":
          description: "\U0001F1E9\U0001F1EA Liste von Events.\n\U0001F1EC\U0001F1E7 List of events.\n"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
  /v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/X-Client-Vendor"
      - $ref: "#/components/parameters/X-Client-Name"
      - $ref: "#/components/parameters/X-Client-Version"
    get:
      description: "\U0001F1E9\U0001F1EA Abfrage eines spezifischen Events.\n\U0001F1EC\U0001F1E7 Query of a specific event.\n"
      tags:
        - Events
      operationId: getEvent
      security:
        - ApiKeyAuth: []
      responses:
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "200":
          description: Der angefragte Event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      description: "\U0001F1E9\U0001F1EA Wird ein offener Event quittiert, wird dieser nicht mehr in <a href=\"#operations-Events-getEvents\">/v1/events</a> aufgeführt.\n\U0001F1EC\U0001F1E7 Once an open event is acknowledged, it will no longer be listed in <a href=\"#operations-Events-getEvents\">/v1/events</a>.\n"
      tags:
        - Events
      operationId: acknowledgeEvent
      security:
        - ApiKeyAuth: []
      responses:
        "401":
          $ref: "#/components/responses/NotAuthenticatedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/UnprocessableContentError"
        "204":
          description: "\U0001F1E9\U0001F1EA Der Event ist quittiert.\n\U0001F1EC\U0001F1E7 The event is acknowledged.\n"
components:
  parameters:
    PremiumYear:
      name: year
      description: "\U0001F1E9\U0001F1EA Prämienjahr, muss zwischen 2025 und dem nächsten Kalenderjahr liegen (Default: Kalenderjahr)\n\U0001F1EC\U0001F1E7 Premium year, must be between 2025 and the next calendar year (default: calendar year).\n"
      in: query
      schema:
        $ref: "#/components/schemas/PremiumYear"
    OccupationCodeId:
      name: occupationCodeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OccupationCodeId"
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EventId"
    # headers
    X-Client-Vendor:
      name: X-Client-Vendor
      in: header
      description: "\U0001F1E9\U0001F1EA Name des Herstellers der Client-Anwendung.\n\U0001F1EC\U0001F1E7 Name of the vendor responsible for the client application.\n"
      required: false
      schema:
        type: string
      example: "Acme Corporation"
    X-Client-Name:
      name: X-Client-Name
      in: header
      description: "\U0001F1E9\U0001F1EA Produkt-Name der Client-Anwendung.\n\U0001F1EC\U0001F1E7 Product name of the client application.\n"
      required: false
      schema:
        type: string
      example: "PayrollPro"
    X-Client-Version:
      name: X-Client-Version
      in: header
      description: "\U0001F1E9\U0001F1EA Version der Anwendung.\n\U0001F1EC\U0001F1E7 Version of the application.\n"
      required: false
      schema:
        type: string
      example: "2.5"
  responses:
    BadRequestError:
      description: "\U0001F1E9\U0001F1EA Anfrage kann nicht verarbeitet werden.\n\U0001F1EC\U0001F1E7 Request cannot be processed.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotAuthenticatedError:
      description: "\U0001F1E9\U0001F1EA Keine gültigen Authentifizierungsdaten für die angeforderte Ressource vorhanden.\n\U0001F1EC\U0001F1E7 No valid authentication data available for the requested resource.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundError:
      description: "\U0001F1E9\U0001F1EA Die angeforderte Resource konnte nicht gefunden werden.\n\U0001F1EC\U0001F1E7 The requested resource could not be found.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableContentError:
      description: "\U0001F1E9\U0001F1EA Die Anfrage konnte nicht verarbeiten werden, da sie ungültige Daten enthält.\n\U0001F1EC\U0001F1E7 The request could not be processed because it contains invalid data.\n"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    # suva occupation code
    SuvaOccupationCode:
      description: "\U0001F1E9\U0001F1EA Suva-Berufscode\n\U0001F1EC\U0001F1E7 Suva occupation code\n"
      type: object
      properties:
        id:
          $ref: "#/components/schemas/SuvaOccupationCodeId"
        descriptions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OccupationDescription"
        iscoOccupationTypeId:
          $ref: "#/components/schemas/IscoOccupationTypeId"
      required:
        - id
        - descriptions
        - iscoOccupationTypeId
    SuvaOccupationCodeId:
      description: "\U0001F1E9\U0001F1EA ID für einen Suva-Berufscode.\n\U0001F1EC\U0001F1E7 ID for a Suva occupation code.\n"
      type: string
    # isco occupation type
    IscoOccupationType:
      description: "\U0001F1E9\U0001F1EA ISCO-Berufsart\n\U0001F1EC\U0001F1E7 ISCO occupation type\n"
      type: object
      properties:
        id:
          $ref: "#/components/schemas/IscoOccupationTypeId"
        companyPartCode:
          $ref: "#/components/schemas/CompanyPartCode"
        subclassSection:
          $ref: "#/components/schemas/SubclassSection"
      required:
        - id
        - companyPartCode
        - subclassSection
    IscoOccupationTypeId:
      description: "\U0001F1E9\U0001F1EA 5-Stellige Nummer für Berufsarten aus der Schweizer Berufsnomenklatur.\n\U0001F1EC\U0001F1E7 5-digit number for occupation type from the Swiss professional nomenclature.\n"
      type: integer
    # occupation code
    OccupationCode:
      description: "\U0001F1E9\U0001F1EA Berufscode (Individuell oder Suva)\n\U0001F1EC\U0001F1E7 Occupation code (individual or Suva)\n"
      type: object
      properties:
        id:
          $ref: "#/components/schemas/OccupationCodeId"
        occupationCodeNumber1:
          $ref: "#/components/schemas/OccupationCodeNumber"
        occupationCodeNumber2:
          $ref: "#/components/schemas/OccupationCodeNumber"
        descriptions:
          type: array
          items:
            $ref: "#/components/schemas/OccupationDescription"
        suvaOccupationCode:
          $ref: "#/components/schemas/SuvaOccupationCode"
        active:
          $ref: "#/components/schemas/OccupationCodeActive"
      required:
        - id
    OccupationCodeId:
      description: "\U0001F1E9\U0001F1EA ID für einen Berufscode.\n\U0001F1EC\U0001F1E7 ID of an occupation code.\n"
      type: string
      format: uuid
    # company part
    CompanyPartProfile:
      description: "\U0001F1E9\U0001F1EA Betriebsteil-Situation\n\U0001F1EC\U0001F1E7 Profiles for a company part\n"
      type: object
      properties:
        companyPartCode:
          $ref: "#/components/schemas/CompanyPartCode"
        iscoOccupationTypeIds:
          description: "\U0001F1E9\U0001F1EA Liste von ISCO-Berufsarten.\n\U0001F1EC\U0001F1E7 List of ISCO occupation types.\n"
          type: array
          items:
            $ref: "#/components/schemas/IscoOccupationTypeId"
        temporalProfiles:
          description: "\U0001F1E9\U0001F1EA Liste von Betriebsteil-Zuständen.\n\U0001F1EC\U0001F1E7 List of company part states.\n"
          type: array
          items:
            $ref: "#/components/schemas/CompanyPartTemporalProfile"
      required:
        - companyPartCode
    CompanyPartCode:
      description: "\U0001F1E9\U0001F1EA Betriebsteil-Code (BT-Code)\n\U0001F1EC\U0001F1E7 Company part code\n"
      type: string
      minLength: 1
      maxLength: 1
    CompanyPartTemporalProfile:
      description: "\U0001F1E9\U0001F1EA Betriebsteil-Zustand\n\U0001F1EC\U0001F1E7 Company part state\n"
      type: object
      properties:
        from:
          type: string
          format: date
        upto:
          type: string
          format: date
        subclassSection:
          $ref: "#/components/schemas/SubclassSection"
        descriptions:
          description: "\U0001F1E9\U0001F1EA Betriebsteil-Bezeichnungen\n\U0001F1EC\U0001F1E7 Company part description\n"
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LocalizedValue"
        premiums:
          $ref: "#/components/schemas/GrossPremium"
      required:
        - from
        - upto
        - subclassSection
        - descriptions
    # events
    Event:
      description: "\U0001F1E9\U0001F1EA Ein Event\n\U0001F1EC\U0001F1E7 An event\n"
      type: object
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        timestamp:
          description: "\U0001F1E9\U0001F1EA Ereigniszeitpunkt\n\U0001F1EC\U0001F1E7 Event occurrence time\n"
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        detail:
          oneOf:
            - $ref: "#/components/schemas/EventOccupationCodeSubmitted"
            - $ref: "#/components/schemas/EventIscoOccupationTypeChanged"
            - $ref: "#/components/schemas/EventGrossPremiumChanged"
          discriminator:
            propertyName: eventType
    EventId:
      description: "\U0001F1E9\U0001F1EA ID für einen Event.\n\U0001F1EC\U0001F1E7 ID of an event.\n"
      type: string
      format: uuid
    OccupationCodeSubmittedDecision:
      description: "\U0001F1E9\U0001F1EA Ergebnis des Event.\n- `accepted` Die Berufscode-Anfrage wurde erfolgreich verarbeitet und gemappt.\n- `rejected` Die Berufscode-Anfrage wurde abgebrochen oder gelöscht.\n\n\U0001F1EC\U0001F1E7 Result of the event.\n- `accepted` The submission of the occupation code was successfully processed and mapped.\n- `rejected` The submission of the occupation code was cancelled or deleted.\n"
      type: string
      enum: [accepted, rejected]
    EventStatus:
      description: "\U0001F1E9\U0001F1EA Status des Event.\n- `created`:  Event wurde erstellt, Prozess für Verarbeitung wurde angestossen.\n- `processed`: Event wurde verarbeitet, es liegen Ergebnisse vor. Event ist in der Auflistung unter <a href=\"#operations-Events-getEvents\">/v1/events</a>.\n- `acknowledged`: Event wurde quittiert. Quittierte Events werden nicht mehr in <a href=\"#operations-Events-getEvents\">/v1/events</a> aufgeführt. Quittierte Events werden nach 30 Tagen aus dem System gelöscht.\n\n\U0001F1EC\U0001F1E7 Status of an event.\n- `created`: Event has been created, and the processing has been initiated.\n- `processed`: Event has been processed and results are available. Event is listed under <a href=\"#operations-Events-getEvents\">/v1/events</a>.\n- `acknowledged`: Event has been acknowledged. Acknowledged events are no longer listed in <a href=\"#operations-Events-getEvents\">/v1/events</a>. Acknowledged events are deleted from the system after 30 days.\n"
      type: string
      enum: [created, processed, acknowledged]
    EventOccupationCodeSubmitted:
      description: "\U0001F1E9\U0001F1EA Ergebnis zu \"Einreichen eines Berufscodes\".\n\U0001F1EC\U0001F1E7 Result for \"Submitting an occupation code\".\n"
      type: object
      properties:
        eventType:
          type: string
        occupation:
          description: "\U0001F1E9\U0001F1EA Wenn das Property `decision` den Wert `rejected` hat, ist `occupation` immer `null`.\n\n\U0001F1EC\U0001F1E7 If the property `decision` is set to `rejected`, `occupation` will always be `null`.\n"
          $ref: "#/components/schemas/OccupationCode"
        decision:
          $ref: "#/components/schemas/OccupationCodeSubmittedDecision"
      required:
        - eventType
    EventIscoOccupationTypeChanged:
      description: "\U0001F1E9\U0001F1EA Ein für den Kunden aktiver ISCO-Berufsart wurde von der Suva einem neuen Risiko (UKT) zugeordnet. Tätigkeiten mit dem geänderten Risiko erhalten potentiell dabei anderen Prämiensätze.\nDer Wechsel vom einer ISCO-Berufsart zu einem neuen Risiko erfolgt immer für ein ganzes Prämienjahr in der Zukunft.\n\n\U0001F1EC\U0001F1E7 An ISCO occupation type active for the customer has been assigned a new risk (UKT) by the Suva. Activities with the changed risk may potentially receive different premium rates.\nThe change from one ISCO occupational occupation type to a new risk always takes effect for a full premium year in the future.\n"
      type: object
      properties:
        eventType:
          type: string
        premiumYear:
          $ref: "#/components/schemas/PremiumYear"
        iscoOccupationType:
          $ref: "#/components/schemas/IscoOccupationType"
      required:
        - eventType
    EventGrossPremiumChanged:
      description: "\U0001F1E9\U0001F1EA Von der Suva wurde für ein Produkt ein neuer Prämiensatz verfügt.\n\U0001F1EC\U0001F1E7 Suva has ordered a new premium rate for a product.\n"
      type: object
      properties:
        eventType:
          type: string
        premiumYear:
          $ref: "#/components/schemas/PremiumYear"
        companyPartCode:
          $ref: "#/components/schemas/CompanyPartCode"
        product:
          $ref: "#/components/schemas/Product"
      required:
        - eventType
    # commons
    OccupationDescription:
      description: "\U0001F1E9\U0001F1EA Sprach- und geschlechtsspezifische Berufsbezeichnung.\n\U0001F1EC\U0001F1E7 Language- and gender-specific occupation description.\n"
      allOf:
        - $ref: "#/components/schemas/LocalizedValue"
        - type: object
